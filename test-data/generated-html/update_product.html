<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory Management</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f3f4f6; padding: 3rem 1rem; }
        .form-card { max-width: 500px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; border: 1px solid #e5e7eb; }
        h2 { font-size: 1.35rem; margin-bottom: 1.5rem; color: #111827; }
        .field { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #374151; }
        input, select, textarea { width: 100%; padding: 0.65rem; border: 1px solid #d1d5db; border-radius: 4px; font-size: 0.95rem; }
        textarea { height: 80px; resize: vertical; }
        .btn-update { width: 100%; background: #059669; color: white; border: none; padding: 0.75rem; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>Modify Product</h2>
        <form action="/products/save-update" method="POST">
            <!-- Invisible context handle value mapping -->
            <input type="hidden" name="id" value="None">

            <div class="field">
                <label>Modify Product Title</label>
                <input type="text" name="title" value="None" required>
            </div>
            <div class="field">
                <label>Verify Current Category</label>
                <select name="category" required>
                    <!-- Default fallback options structure -->
                    <option value="Electronics">Electronics</option>
                    <option value="Apparel">Apparel</option>
                    <option value="Home & Kitchen">Home & Kitchen</option>
                    <option value="Fitness & Outdoors">Fitness & Outdoors</option>
                </select>
            </div>
            <div class="field">
                <label>Update Selling Price ($)</label>
                <input type="number" name="currentPrice" step="0.01" value="None" required>
            </div>
            <div class="field">
                <label>Edit Details Content</label>
                <textarea name="description" required>None</textarea>
            </div>
            <button type="submit" class="btn-update">Commit Modification Updates</button>
        </form>
    </div>

</body>
</html>
