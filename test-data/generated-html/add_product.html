<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Product Form</title>
    <style>
        body { font-family: sans-serif; background: #f3f4f6; padding: 3rem; }
        .form { background: white; max-width: 400px; margin: 0 auto; padding: 2rem; border-radius: 8px; }
        .field { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.3rem; font-weight: bold; }
        input { width: 100%; padding: 0.5rem; }
    </style>
</head>
<body>
    <div class="form">
        <h2>Add New Product</h2>
        <div class="field">
            <label>Product Title</label>
            <input type="text" placeholder="Enter name...">
        </div>
        <div class="field">
            <label>Price</label>
            <input type="number">
        </div>
    </div>
</body>
</html>
