<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
</head>
<body>
    <h1>{{ heading }}</h1>
    <p>Welcome, {{ name }}!</p>
    
    {% if logged_in %}
    <div class="user-panel">
        <p>Hello, {{ user.name }}</p>
    </div>
    {% endif %}
    
    <ul>
    {% for item in items %}
        <li>{{ item.name }}</li>
    {% endfor %}
    </ul>
</body>
</html>
